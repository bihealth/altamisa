# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Install uv and let it create the environment from uv.lock (project plus the
# "docs" dependency group), see
# https://docs.readthedocs.io/en/stable/build-customization.html
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    create_environment:
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync --locked --no-dev --group docs

# Build documentation in the docs/ directory with Sphinx
sphinx:
  configuration: docs/conf.py
